name: Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.js
      - run: node --check data.js
      - run: node --check .github/scripts/price-freshness.mjs
      - run: node --test tests/*.test.mjs
